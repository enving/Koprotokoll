name: Docker-Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t koprotokoll:test .
      - name: Start und Zugriffsschutz prüfen
        run: |
          docker run --detach --name koprotokoll-test -p 127.0.0.1:8000:8000 koprotokoll:test
          python scripts/docker_smoke.py http://127.0.0.1:8000
      - name: Containerprotokoll
        if: failure()
        run: docker logs koprotokoll-test
